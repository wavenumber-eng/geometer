name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  release-signoff:
    name: ${{ matrix.os }} / L99
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Sync dev tools
        run: uv sync --group dev --no-install-project
      - name: Run release signoff
        run: uv run --no-sync pytest tests/L99_release -q
