---
# yamllint disable rule:line-length
name: Build Release Candidate

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  GEOMETER_OCCT_BINARY: only
  GEOMETER_REQUIRE_NATIVE_TEST_SERVERS: "1"

jobs:
  verify:
    name: release metadata
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_revision: ${{ steps.identity.outputs.source_revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Run non-mutating release orchestration preflight
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py run
          --ledger out/ci-ledger-release-verify.json
          --lane release-verify
          --kind test
          --name "release orchestration preflight"
          --
          uv run --group dev pytest
          tests/python/test_candidate_root.py
          tests/python/test_ci_execution_ledger.py
          tests/python/test_release_promotion_plan.py
          tests/python/test_release_inventory.py
          -q
      - name: Verify generated contracts
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          npm ci
          uv run --no-project python scripts/ci_execution_ledger.py run \
            --ledger out/ci-ledger-release-verify.json \
            --lane release-verify \
            --kind test \
            --name "generated contract drift" \
            -- npm run check:contracts
      - name: Verify source and expected tag match package metadata
        id: identity
        shell: bash
        run: |
          source_revision="$(git rev-parse HEAD)"
          release_tag="$(uv run python scripts/ci_release_metadata.py tag)"
          test "$source_revision" = "$GITHUB_SHA"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          uv run --no-project python scripts/ci_execution_ledger.py run \
            --ledger out/ci-ledger-release-verify.json \
            --lane release-verify \
            --kind test \
            --name "release metadata tag" \
            -- uv run python scripts/ci_release_metadata.py check-tag "$release_tag"
          uv run --no-project python scripts/ci_execution_ledger.py run \
            --ledger out/ci-ledger-release-verify.json \
            --lane release-verify \
            --kind test \
            --name "candidate source identity" \
            -- bash -c 'test "$(git rev-parse HEAD)" = "$1"' \
            bash "$GITHUB_SHA"
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          uv run --no-project python scripts/ci_execution_ledger.py run \
            --ledger out/ci-ledger-release-verify.json \
            --lane release-verify \
            --kind test \
            --name "candidate main ancestry" \
            -- git merge-base --is-ancestor HEAD "origin/$GITHUB_REF_NAME"
      - name: Verify release notes mention package version
        shell: bash
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py run
          --ledger out/ci-ledger-release-verify.json
          --lane release-verify
          --kind test
          --name "release notes version"
          --
          uv run python scripts/ci_release_metadata.py check-notes
      - name: Run release signoff gate
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py run
          --ledger out/ci-ledger-release-verify.json
          --lane release-verify
          --kind test
          --name "L99 release gate"
          --
          uv run --group dev rack run L99_release
      - name: Run standards check
        run: |
          uv run --no-project python scripts/ci_execution_ledger.py run \
            --ledger out/ci-ledger-release-verify.json \
            --lane release-verify \
            --kind test \
            --name "repository standards" \
            -- uvx --from wn-dev-std==2026.9.8 wn-dev-std check . --format json
          uv run --no-project python scripts/ci_execution_ledger.py run \
            --ledger out/ci-ledger-release-verify.json \
            --lane release-verify \
            --kind test \
            --name "release standards audit" \
            -- uvx --from wn-dev-std==2026.9.8 wn-dev-std audit . --mode release --format json
      - name: Report release orchestration timing
        if: always() && hashFiles('out/ci-ledger-release-verify.json') != ''
        shell: bash
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py summary
          --ledger out/ci-ledger-release-verify.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release orchestration ledger
        if: always() && hashFiles('out/ci-ledger-release-verify.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-ledger-release-verify
          path: out/ci-ledger-release-verify.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.platform }}, py3.12)
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            compiler: msvc
          - os: ubuntu-22.04
            platform: linux-x64
            compiler: gcc
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            compiler: gcc
          - os: macos-15
            platform: macos-arm64
            compiler: apple-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.source_revision }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        if: matrix.platform == 'linux-x64'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Pin Node package manager
        if: matrix.platform == 'linux-x64'
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgl1-mesa-dev libdbus-1-dev libudev-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev wayland-protocols

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Build and qualify native release candidate
        run: >-
          uv run --group dev python scripts/build_release_candidate.py
          --ledger out/ci-ledger-${{ matrix.platform }}.json
          native
          --platform ${{ matrix.platform }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist-${{ matrix.platform }}
          path: out/release-candidate/${{ matrix.platform }}/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-dist-${{ matrix.platform }}
          path: out/release-candidate/${{ matrix.platform }}/native-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload static SDK candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-dist-${{ matrix.platform }}
          path: |
            out/release-candidate/${{ matrix.platform }}/geometer-sdk-*.zip
            out/release-candidate/${{ matrix.platform }}/geometer-sdk-*.zip.sha256
            out/release-candidate/${{ matrix.platform }}/geometer-sdk-*.zip.provenance.json
          if-no-files-found: error
          retention-days: 1

      - name: Report native lane timing
        if: always() && hashFiles(format('out/ci-ledger-{0}.json', matrix.platform)) != ''
        shell: bash
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py summary
          --ledger out/ci-ledger-${{ matrix.platform }}.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native lane ledger
        if: always() && hashFiles(format('out/ci-ledger-{0}.json', matrix.platform)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-ledger-${{ matrix.platform }}
          path: out/ci-ledger-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 1

  wasm:
    name: wasm dist
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.source_revision }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install Node toolchain
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Cache Emscripten SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .deps/emsdk
          key: emsdk-v2-linux-x64-${{ steps.dependency_versions.outputs.emsdk_version }}

      - name: Cache Geometer WASM build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build-wasm
          key: geometer-wasm-v3-linux-x64-${{ github.sha }}

      - name: Build and qualify WASM release candidate
        run: >-
          uv run --group dev python scripts/build_release_candidate.py
          --ledger out/ci-ledger-wasm.json
          wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-dist
          path: out/release-candidate/wasm/wasm-dist.zip
          if-no-files-found: error
          retention-days: 1

      - name: Report WASM lane timing
        if: always() && hashFiles('out/ci-ledger-wasm.json') != ''
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py summary
          --ledger out/ci-ledger-wasm.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM lane ledger
        if: always() && hashFiles('out/ci-ledger-wasm.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-ledger-wasm
          path: out/ci-ledger-wasm.json
          if-no-files-found: error
          retention-days: 1

  qualify-release:
    name: immutable release inventory
    needs: [verify, build, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.source_revision }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Download every release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-dist*"
          path: out/release-candidate

      - name: Download every candidate execution ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-ledger-*
          path: out/ci-ledgers
          merge-multiple: true

      - name: Validate exact release inventory
        run: |
          uv run --no-project python scripts/candidate_root.py create-checkout out/candidate-root.json
          uv run --no-project python scripts/candidate_validation.py \
            out/release-candidate \
            out/ci-ledgers \
            --tag "$RELEASE_TAG" \
            --candidate-root out/candidate-root.json \
            --log-reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "out/release-candidate/geometer-release-validation-${RELEASE_TAG}.json"
          uv run --no-project python scripts/validate_release_inventory.py \
            out/release-candidate \
            --tag "$RELEASE_TAG" \
            --candidate-root out/candidate-root.json \
            --output "out/geometer-release-inventory-${RELEASE_TAG}.json"

      - name: Stage and reverify flat promotion payload
        shell: bash
        run: |
          mkdir out/qualified-release
          while IFS= read -r -d '' asset; do
            destination="out/qualified-release/$(basename "$asset")"
            test ! -e "$destination"
            cp "$asset" "$destination"
          done < <(find out/release-candidate -type f -print0)
          cp "out/geometer-release-inventory-${RELEASE_TAG}.json" out/qualified-release/
          uv run --no-project python scripts/verify_release_inventory.py \
            out/qualified-release \
            --tag "$RELEASE_TAG" \
            --source-revision "${{ needs.verify.outputs.source_revision }}"

      - name: Attest the qualified static SDK archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/qualified-release/geometer-*.zip

      - name: Attest the canonical release inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/qualified-release/geometer-release-inventory-*.json

      - name: Upload qualified immutable payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-release
          path: out/qualified-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Report promotion command
        shell: bash
        run: |
          inventory="out/qualified-release/geometer-release-inventory-${RELEASE_TAG}.json"
          echo '## Qualified release candidate' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate run: \`$GITHUB_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ needs.verify.outputs.source_revision }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Inventory SHA-256: \`$(sha256sum "$inventory" | cut -d ' ' -f 1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Promote with candidate run \`$GITHUB_RUN_ID\`." >> "$GITHUB_STEP_SUMMARY"
