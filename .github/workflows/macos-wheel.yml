---
# yamllint disable rule:line-length
name: macOS Wheel

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Sync dev tools
        run: uv sync --group dev
      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output
      - name: Run release signoff
        run: uv run pytest tests/L99_release -q
      - name: Cache OCCT
        uses: actions/cache@v5
        with:
          path: |
            .deps/occt-src
            .deps/native/macos-arm64/occt-build
            .deps/native/macos-arm64/occt-install
          key: occt-${{ runner.os }}-${{ runner.arch }}-apple-clang-${{ steps.dependency_versions.outputs.occt_tag }}-${{ hashFiles('scripts/build_occt.py', 'scripts/dependency_versions.py', 'scripts/occt_binary_cache.py', 'third_party/rapidjson/**') }}
          restore-keys: |
            occt-${{ runner.os }}-${{ runner.arch }}-apple-clang-${{ steps.dependency_versions.outputs.occt_tag }}-
      - name: Validate native build
        run: uv run python scripts/validate_native.py
      - name: Validate Python package
        run: uv run python scripts/validate_python_package.py --skip-native-validation
      - name: Check wheel
        run: uv run twine check out/wheelhouse/macos-arm64/*.whl
      - name: Upload macOS native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geometer-macos-arm64-native
          path: dist/native/macos-arm64/**
      - name: Upload macOS wheel
        uses: actions/upload-artifact@v7
        with:
          name: geometer-macos-arm64-wheel
          path: out/wheelhouse/macos-arm64/*.whl
