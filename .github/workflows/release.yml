---
# yamllint disable rule:line-length
name: Publish

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing vYYYY-MM-DD tag to build, qualify, and publish
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  GEOMETER_OCCT_BINARY: only
  GEOMETER_REQUIRE_NATIVE_TEST_SERVERS: "1"
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run non-mutating release orchestration preflight
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py run
          --ledger out/ci-execution-ledger.json
          --lane release-verify
          --kind test
          --name "release orchestration preflight"
          --
          uv run --group dev pytest
          tests/python/test_candidate_root.py
          tests/python/test_ci_execution_ledger.py
          tests/python/test_release_promotion_plan.py
          tests/python/test_release_inventory.py
          -q
      - name: Report release orchestration timing
        if: always() && hashFiles('out/ci-execution-ledger.json') != ''
        shell: bash
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py summary
          --ledger out/ci-execution-ledger.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release orchestration ledger
        if: always() && hashFiles('out/ci-execution-ledger.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-ledger-release-verify
          path: out/ci-execution-ledger.json
          if-no-files-found: error

      - name: Verify generated contracts
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          npm ci
          npm run check:contracts
      - name: Verify tag matches package version
        shell: bash
        run: |
          uv run python scripts/ci_release_metadata.py check-tag "$RELEASE_TAG"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
      - name: Verify release notes mention package version
        shell: bash
        run: uv run python scripts/ci_release_metadata.py check-notes
      - name: Run release signoff gate
        run: uv run --group dev rack run L99_release
      - name: Run standards check
        run: |
          uvx --from wn-dev-std==2026.9.8 wn-dev-std check . --format json
          uvx --from wn-dev-std==2026.9.8 wn-dev-std audit . --mode release --format json

  build:
    name: build (${{ matrix.platform }}, py3.12)
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            compiler: msvc
          - os: ubuntu-22.04
            platform: linux-x64
            compiler: gcc
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            compiler: gcc
          - os: macos-15
            platform: macos-arm64
            compiler: apple-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        if: matrix.platform == 'linux-x64'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restore pinned browser-test dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          npm install --global npm@11.16.0
          npm ci
          npm run check:node-toolchain

      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgl1-mesa-dev libdbus-1-dev libudev-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev wayland-protocols

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Build and qualify native release candidate
        run: >-
          uv run --group dev python scripts/build_release_candidate.py
          --ledger out/ci-execution-ledger.json
          native
          --platform ${{ matrix.platform }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ matrix.platform }}
          path: out/release-candidate/${{ matrix.platform }}/wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-dist-${{ matrix.platform }}
          path: out/release-candidate/${{ matrix.platform }}/native-${{ matrix.platform }}.zip
          if-no-files-found: error

      - name: Upload static SDK candidate
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist-${{ matrix.platform }}
          path: |
            out/release-candidate/${{ matrix.platform }}/geometer-sdk-*.zip
            out/release-candidate/${{ matrix.platform }}/geometer-sdk-*.zip.sha256
            out/release-candidate/${{ matrix.platform }}/geometer-sdk-*.zip.provenance.json
          if-no-files-found: error

      - name: Report native lane timing
        if: always() && hashFiles('out/ci-execution-ledger.json') != ''
        shell: bash
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py summary
          --ledger out/ci-execution-ledger.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native lane ledger
        if: always() && hashFiles('out/ci-execution-ledger.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-ledger-${{ matrix.platform }}
          path: out/ci-execution-ledger.json
          if-no-files-found: error

  wasm:
    name: wasm dist
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Node toolchain
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          npm ci

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Cache Emscripten SDK
        uses: actions/cache@v5
        with:
          path: .deps/emsdk
          key: emsdk-v2-linux-x64-${{ steps.dependency_versions.outputs.emsdk_version }}

      - name: Cache Geometer WASM build
        uses: actions/cache@v5
        with:
          path: build-wasm
          key: geometer-wasm-v3-linux-x64-${{ github.sha }}

      - name: Build and qualify WASM release candidate
        run: >-
          uv run --group dev python scripts/build_release_candidate.py
          --ledger out/ci-execution-ledger.json
          wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-dist
          path: out/release-candidate/wasm/wasm-dist.zip
          if-no-files-found: error

      - name: Report WASM lane timing
        if: always() && hashFiles('out/ci-execution-ledger.json') != ''
        run: >-
          uv run --no-project python scripts/ci_execution_ledger.py summary
          --ledger out/ci-execution-ledger.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM lane ledger
        if: always() && hashFiles('out/ci-execution-ledger.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-ledger-wasm
          path: out/ci-execution-ledger.json
          if-no-files-found: error

  qualify-release:
    name: immutable release inventory
    needs: [build, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Download every release candidate
        uses: actions/download-artifact@v8
        with:
          pattern: "*-dist*"
          path: out/release-candidate

      - name: Validate exact release inventory
        run: |
          uv run --no-project python scripts/candidate_root.py create-checkout out/candidate-root.json
          uv run --no-project python scripts/validate_release_inventory.py \
            out/release-candidate \
            --tag "$RELEASE_TAG" \
            --candidate-root out/candidate-root.json \
            --output "out/geometer-release-inventory-${RELEASE_TAG}.json"

      - name: Attest the qualified static SDK archives
        uses: actions/attest@v4
        with:
          subject-path: out/release-candidate/**/geometer-*.zip

      - name: Attest the canonical release inventory
        uses: actions/attest@v4
        with:
          subject-path: out/geometer-release-inventory-*.json

      - name: Upload qualified immutable payload
        uses: actions/upload-artifact@v7
        with:
          name: qualified-release
          path: |
            out/release-candidate/**
            out/geometer-release-inventory-*.json
          if-no-files-found: error

  github-assets:
    name: immutable draft assets
    needs: qualify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: qualified-release
          path: out/qualified-release

      - name: Create draft and upload immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          notes="docs/releases/$(python scripts/ci_release_metadata.py date).md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Geometer ${RELEASE_TAG#v}" \
            --notes-file "$notes"
          mapfile -d '' assets < <(find out/qualified-release -type f -print0)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"

      - name: Re-download and verify the draft asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/draft-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/draft-release
          python scripts/verify_release_inventory.py out/draft-release --tag "$RELEASE_TAG" --source-revision "$(git rev-parse HEAD)"

  pypi:
    name: PyPI trusted publish
    needs: github-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/wn-geometer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Download qualified release payload
        uses: actions/download-artifact@v8
        with:
          name: qualified-release
          path: out/qualified-release

      - name: Verify payload and select the four qualified platform wheels
        run: |
          python scripts/verify_release_inventory.py out/qualified-release --tag "$RELEASE_TAG" --source-revision "$(git rev-parse HEAD)"
          mkdir dist-pypi
          find out/qualified-release -type f -name '*.whl' -exec cp '{}' dist-pypi/ \;
          test "$(find dist-pypi -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 4

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi

  publish-release:
    name: publish qualified GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Verify draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          mkdir -p out/draft-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/draft-release
          python scripts/verify_release_inventory.py out/draft-release --tag "$RELEASE_TAG" --source-revision "$(git rev-parse HEAD)"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  verify-public:
    name: verify public release
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Download and verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          mkdir -p out/public-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/public-release
          python scripts/verify_release_inventory.py out/public-release --tag "$RELEASE_TAG" --source-revision "$(git rev-parse HEAD)"
          mapfile -d '' attestable_archives < <(find out/public-release -maxdepth 1 -type f -name 'geometer-sdk-*.zip' -print0)
          test "${#attestable_archives[@]}" -eq 4
          for asset in "${attestable_archives[@]}"; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA"
          done
          gh attestation verify "out/public-release/geometer-release-inventory-${RELEASE_TAG}.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"
