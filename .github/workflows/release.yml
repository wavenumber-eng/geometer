---
# yamllint disable rule:line-length
name: Promote Release Candidate

"on":
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Build Release Candidate workflow run ID
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}

jobs:
  fetch:
    name: fetch qualified candidate artifact
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_revision: ${{ steps.run.outputs.source_revision }}
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Verify candidate workflow run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r .name <<<"$run")" = "Build Release Candidate"
          test "$(jq -r .path <<<"$run")" = ".github/workflows/release-candidate.yml"
          test "$(jq -r .event <<<"$run")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"$run")" = "${{ github.event.repository.default_branch }}"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          source_revision="$(jq -r .head_sha <<<"$run")"
          test "${#source_revision}" -eq 40
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

      - name: Download qualified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qualified-release
          path: out/promotion-payload
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Read candidate identity
        id: identity
        shell: bash
        run: |
          shopt -s nullglob
          inventories=(out/promotion-payload/geometer-release-inventory-v*.json)
          test "${#inventories[@]}" -eq 1
          release_tag="$(jq -r .release_tag "${inventories[0]}")"
          test "$(jq -r .candidate_root.source.revision "${inventories[0]}")" = "${{ steps.run.outputs.source_revision }}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Upload inert promotion handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-payload
          path: out/promotion-payload/**
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify tag and candidate without channel credentials
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.fetch.outputs.release_tag }}
      SOURCE_REVISION: ${{ needs.fetch.outputs.source_revision }}
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download inert promotion handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promotion-payload
          path: out/promotion-payload

      - name: Verify immutable tag and every candidate byte
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_REVISION"
          python scripts/verify_release_inventory.py \
            out/promotion-payload \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"

      - name: Preflight GitHub release state before PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p out/github-preflight
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > out/github-preflight/release.json 2> out/github-preflight/release.error; then
            release="$(cat out/github-preflight/release.json)"
          else
            if grep -q '(HTTP 404)' out/github-preflight/release.error; then
              exit 0
            fi
            cat out/github-preflight/release.error >&2
            exit 1
          fi
          inventory="geometer-release-inventory-${RELEASE_TAG}.json"
          if test "$(jq '.assets | length' <<<"$release")" -ne 0; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/github-preflight
          fi
          rm out/github-preflight/release.json out/github-preflight/release.error
          if test "$(jq -r .draft <<<"$release")" = false; then
            test -f "out/github-preflight/$inventory"
            cmp "out/github-preflight/$inventory" "out/promotion-payload/$inventory"
            python scripts/verify_release_inventory.py \
              out/github-preflight \
              --tag "$RELEASE_TAG" \
              --source-revision "$SOURCE_REVISION"
            exit 0
          fi
          inventory_present=false
          if test -f "out/github-preflight/$inventory"; then
            cmp "out/github-preflight/$inventory" "out/promotion-payload/$inventory"
            rm "out/github-preflight/$inventory"
            inventory_present=true
          fi
          python scripts/snapshot_release_channel.py out/github-preflight \
            --channel github \
            --output out/github-preflight.json
          python scripts/plan_release_promotion.py \
            "out/promotion-payload/$inventory" \
            out/github-preflight.json \
            --output out/github-preflight-plan.json
          if test "$inventory_present" = true && test "$(jq '.uploads | length' out/github-preflight-plan.json)" -ne 0; then
            echo "GitHub inventory commit marker exists before all assets" >&2
            exit 1
          fi

  pypi:
    name: reconcile PyPI trusted publication
    needs: [fetch, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.fetch.outputs.release_tag }}
      SOURCE_REVISION: ${{ needs.fetch.outputs.source_revision }}
    environment:
      name: pypi
      url: https://pypi.org/p/wn-geometer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download verified promotion handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promotion-payload
          path: out/promotion-payload

      - name: Verify payload and inspect PyPI state
        id: pypi_state
        shell: bash
        run: |
          python scripts/verify_release_inventory.py \
            out/promotion-payload \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          python scripts/check_pypi_release.py \
            "out/promotion-payload/geometer-release-inventory-${RELEASE_TAG}.json"
          mkdir dist-pypi
          cp out/promotion-payload/*.whl dist-pypi/
          test "$(find dist-pypi -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 4

      - name: Publish only missing wheels
        if: steps.pypi_state.outputs.needs_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-pypi
          skip-existing: true

      - name: Require complete PyPI publication
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            result="$(python scripts/check_pypi_release.py \
              "out/promotion-payload/geometer-release-inventory-${RELEASE_TAG}.json")"
            if test "$(jq -r .needs_upload <<<"$result")" = false; then
              exit 0
            fi
            test "$attempt" -lt 5
            sleep 15
          done

  github-release:
    name: publish exact GitHub release
    needs: [fetch, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-github-production
    env:
      RELEASE_TAG: ${{ needs.fetch.outputs.release_tag }}
      SOURCE_REVISION: ${{ needs.fetch.outputs.source_revision }}
    permissions:
      contents: write
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified promotion handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promotion-payload
          path: out/promotion-payload

      - name: Reconcile, verify, and publish exact GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_REVISION"

          inventory="geometer-release-inventory-${RELEASE_TAG}.json"
          mkdir -p out/github-observed
          release_exists=false
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > out/github-observed/release.json 2> out/github-observed/release.error; then
            release="$(cat out/github-observed/release.json)"
            release_exists=true
            if test "$(jq '.assets | length' <<<"$release")" -ne 0; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/github-observed
            fi
          else
            if ! grep -q '(HTTP 404)' out/github-observed/release.error; then
              cat out/github-observed/release.error >&2
              exit 1
            fi
          fi
          rm -f out/github-observed/release.json out/github-observed/release.error
          if test "$release_exists" = false; then
            git show "$SOURCE_REVISION:docs/releases/${RELEASE_TAG:1:10}.md" > out/release-notes.md
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Geometer ${RELEASE_TAG#v}" \
              --notes-file out/release-notes.md
          fi

          inventory_present=false
          if test -f "out/github-observed/$inventory"; then
            cmp "out/github-observed/$inventory" "out/promotion-payload/$inventory"
            rm "out/github-observed/$inventory"
            inventory_present=true
          fi
          python scripts/snapshot_release_channel.py out/github-observed \
            --channel github \
            --output out/github-observed.json
          python scripts/plan_release_promotion.py \
            "out/promotion-payload/$inventory" \
            out/github-observed.json \
            --output out/github-plan.json
          if test "$inventory_present" = true && test "$(jq '.uploads | length' out/github-plan.json)" -ne 0; then
            echo "GitHub inventory commit marker exists before all assets" >&2
            exit 1
          fi
          while IFS= read -r name; do
            gh release upload "$RELEASE_TAG" "out/promotion-payload/$name" --repo "$GITHUB_REPOSITORY"
          done < <(jq -r '.uploads[].name' out/github-plan.json)
          if test "$inventory_present" = false; then
            gh release upload "$RELEASE_TAG" "out/promotion-payload/$inventory" --repo "$GITHUB_REPOSITORY"
          fi

          mkdir -p out/github-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/github-release
          python scripts/verify_release_inventory.py \
            out/github-release \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          if test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_REVISION"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  verify-public:
    name: verify public channel identity
    needs: [fetch, pypi, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.fetch.outputs.release_tag }}
      SOURCE_REVISION: ${{ needs.fetch.outputs.source_revision }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download and verify public GitHub bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_REVISION"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          mkdir out/public-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/public-release
          python scripts/verify_release_inventory.py \
            out/public-release \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          python scripts/check_pypi_release.py \
            "out/public-release/geometer-release-inventory-${RELEASE_TAG}.json"
          mapfile -d '' archives < <(find out/public-release -maxdepth 1 -type f -name 'geometer-sdk-*.zip' -print0)
          test "${#archives[@]}" -eq 4
          for asset in "${archives[@]}"; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$SOURCE_REVISION"
          done
          gh attestation verify "out/public-release/geometer-release-inventory-${RELEASE_TAG}.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-digest "$SOURCE_REVISION"
