[package]
name = "geometer-sys"
version = "2026.9.19"
edition = "2024"
rust-version = "1.85"
description = "Unsafe FFI and static SDK link projection for Geometer"
license = "MIT"
repository = "https://github.com/wavenumber-eng/geometer"
links = "geometer"
build = "build.rs"

[lib]
path = "src/lib.rs"

[build-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
