file = "test_ipc_client.py"
name = "Persistent Executable IPC Client"
description = "Checks bounded threaded IPC A0 framing, generated welcome/catalog validation, strict named attachments, analytic dispatch, required native fake-server timeout/crash coverage, cancellation/draining, poisoning, and graceful shutdown."
test_case_type = "integration"

[[subtests]]
