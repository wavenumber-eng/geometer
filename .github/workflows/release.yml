---
# yamllint disable rule:line-length
name: Promote Release Candidate

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing vYYYY-MM-DD tag to promote
        required: true
        type: string
      source_revision:
        description: Exact 40-character candidate source commit
        required: true
        type: string
      inventory_sha256:
        description: Exact immutable candidate inventory SHA-256
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_REVISION: ${{ inputs.source_revision }}
  INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}

jobs:
  fetch:
    name: fetch immutable R2 candidate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-candidate-read
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Fetch exact candidate bytes without executing them
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >-
          python scripts/fetch_release_candidate.py out/promotion-payload
          --tag "$RELEASE_TAG"
          --source-revision "$SOURCE_REVISION"
          --inventory-sha256 "$INVENTORY_SHA256"

      - name: Upload inert promotion handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-payload
          path: out/promotion-payload/**
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify tag and candidate without channel credentials
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download inert promotion handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promotion-payload
          path: out/promotion-payload

      - name: Verify immutable tag and every candidate byte
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_REVISION"
          inventory="out/promotion-payload/geometer-release-inventory-${RELEASE_TAG}.json"
          test "$(sha256sum "$inventory" | cut -d ' ' -f 1)" = "$INVENTORY_SHA256"
          python scripts/verify_release_inventory.py \
            out/promotion-payload \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"

  github-draft:
    name: reconcile immutable GitHub draft
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified promotion handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promotion-payload
          path: out/promotion-payload

      - name: Create or resume the draft with exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          inventory="geometer-release-inventory-${RELEASE_TAG}.json"
          mkdir -p out/github-observed
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/github-observed
          else
            git fetch origin "$SOURCE_REVISION"
            git show "$SOURCE_REVISION:docs/releases/${RELEASE_TAG:1:10}.md" > out/release-notes.md
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Geometer ${RELEASE_TAG#v}" \
              --notes-file out/release-notes.md
          fi

          inventory_present=false
          if test -f "out/github-observed/$inventory"; then
            cmp "out/github-observed/$inventory" "out/promotion-payload/$inventory"
            rm "out/github-observed/$inventory"
            inventory_present=true
          fi
          python scripts/snapshot_release_channel.py out/github-observed \
            --channel github \
            --output out/github-observed.json
          python scripts/plan_release_promotion.py \
            "out/promotion-payload/$inventory" \
            out/github-observed.json \
            --output out/github-plan.json
          if test "$inventory_present" = true && test "$(jq '.uploads | length' out/github-plan.json)" -ne 0; then
            echo "GitHub inventory commit marker exists before all assets" >&2
            exit 1
          fi
          while IFS= read -r name; do
            gh release upload "$RELEASE_TAG" "out/promotion-payload/$name" --repo "$GITHUB_REPOSITORY"
          done < <(jq -r '.uploads[].name' out/github-plan.json)
          if test "$inventory_present" = false; then
            gh release upload "$RELEASE_TAG" "out/promotion-payload/$inventory" --repo "$GITHUB_REPOSITORY"
          fi

          mkdir -p out/github-verified
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/github-verified
          python scripts/verify_release_inventory.py \
            out/github-verified \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"

  pypi:
    name: reconcile PyPI trusted publication
    needs: github-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/wn-geometer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download verified promotion handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: promotion-payload
          path: out/promotion-payload

      - name: Verify payload and inspect PyPI state
        id: pypi_state
        shell: bash
        run: |
          python scripts/verify_release_inventory.py \
            out/promotion-payload \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          python scripts/check_pypi_release.py \
            "out/promotion-payload/geometer-release-inventory-${RELEASE_TAG}.json"
          mkdir dist-pypi
          cp out/promotion-payload/*.whl dist-pypi/
          test "$(find dist-pypi -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 4

      - name: Publish only missing wheels
        if: steps.pypi_state.outputs.needs_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-pypi
          skip-existing: true

  github-release:
    name: publish exact GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download and verify GitHub assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir out/github-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/github-release
          python scripts/verify_release_inventory.py \
            out/github-release \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          if test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  r2-tag:
    name: commit immutable R2 tag alias
    needs: [pypi, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-production
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Create or verify the final R2 tag alias
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >-
          python scripts/publish_release_tag.py
          --tag "$RELEASE_TAG"
          --source-revision "$SOURCE_REVISION"
          --inventory-sha256 "$INVENTORY_SHA256"

  verify-public:
    name: verify public channel identity
    needs: r2-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out trusted promotion code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download and verify public GitHub bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          mkdir out/public-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir out/public-release
          python scripts/verify_release_inventory.py \
            out/public-release \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION"
          python scripts/check_pypi_release.py \
            "out/public-release/geometer-release-inventory-${RELEASE_TAG}.json"
          mapfile -d '' archives < <(find out/public-release -maxdepth 1 -type f -name 'geometer-sdk-*.zip' -print0)
          test "${#archives[@]}" -eq 4
          for asset in "${archives[@]}"; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$SOURCE_REVISION"
          done
          gh attestation verify "out/public-release/geometer-release-inventory-${RELEASE_TAG}.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-digest "$SOURCE_REVISION"
