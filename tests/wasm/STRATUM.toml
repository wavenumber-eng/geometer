name = "WASM Contract Transports"
order = 4
description = "Verify full-browser generic operation and retained WASM interfaces against committed artifacts."
enabled = true
runner = "pytest"
concerns = ["wasm", "contracts", "compatibility"]

objectives = [
    "Execute model bounds through the generated outcome and generic attachment C ABI on wasm32.",
    "Verify the operation catalog reports the governed wasm32 descriptor layout.",
    "Retain STEP-to-GLB and packed planar WASM compatibility round trips.",
    "Open the analytic polygon-pour single-file demo through file:// and verify two real Worker/WASM solves plus shared theme invariants.",
    "Exercise the standalone PCB editor through file:// Chrome: via move/add, 45-degree routing, polygon editing, latest-only solves, and zero network requests.",
    "Require exact canonical analytic packet parity across native executable IPC and the distributed browser WASM generic-operation ABI.",
]

[[subtests]]
id = "WASM_001"
file = "test_wasm_validations.py"
name = "Browser WASM Contract Validation"
description = "Runs Node-hosted smoke tests against the committed full-browser WASM artifact."
test_case_type = "integration"

[[subtests]]
id = "WASM_002"
file = "test_analytic_standalone_demo.py"
name = "Standalone Analytic Polygon Pour"
description = "Opens the single-file demo directly in Chrome and validates its Worker/WASM solve and visual-system invariants."
test_case_type = "integration"

[[subtests]]
id = "WASM_003"
file = "test_pcb_standalone_demo.py"
name = "Standalone Interactive PCB Polygon Pour"
description = "Opens the single-file PCB editor in Chrome and verifies real editing gestures drive distinct Worker/WASM solves without runtime network access."
test_case_type = "integration"

[[subtests]]
id = "WASM_004"
file = "test_analytic_cross_transport_parity.py"
name = "Analytic Cross-Transport Canonical Parity"
description = "Runs one governed primitive-family request with a self query through executable IPC and browser WASM, requiring exact result bytes and standalone job digests."
test_case_type = "integration"
