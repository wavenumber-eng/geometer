[[artifacts]]
id = "committed-distribution-artifacts"
kind = "runtime_binary"
paths = ["dist/**"]
tracked = "required"
produced_by = "CMake native builds, scripts/build_wasm.py, and deterministic demo/package builders"
included_in_release = "native, Python, WASM, and browser release surfaces as selected by the release packager"
retention = "committed under the grouped dist policy"

[[artifacts]]
id = "generated-contract-sources"
kind = "generated_source"
paths = ["src/**/generated/**", "python/**/generated/**"]
tracked = "required"
produced_by = "the deterministic cross-language contract generators under scripts/"
included_in_release = "native, Rust, and Python source distributions"
retention = "committed and regenerated whenever the TypeSpec authority changes"
source_of_truth = "src/tsp/geometer/main.tsp"
regeneration_command = "npm run generate:contracts"

[[artifacts]]
id = "governed-packet-vector-fixtures"
kind = "fixture_data"
paths = ["tests/contracts/vectors/**/*.hex", "tests/contracts/vectors/**/*.bin"]
tracked = "required"
produced_by = "scripts/write_analytic_packet_vectors.py and governed contract-vector writers"
included_in_release = "source and test distributions"
retention = "committed as deterministic cross-language regression evidence"

[[artifacts]]
id = "native-static-sdk-candidates"
kind = "transient_output"
paths = ["out/sdk-candidate/**"]
tracked = "forbidden"
produced_by = "the four-platform static SDK candidate workflow from one authoritative clean source revision"
included_in_release = "never directly; only the exact candidate bytes that pass external consumers and the KiCad Cruncher trial may be promoted"
retention = "untracked CI or draft-release evidence retained through the candidate review and immutable promotion decision"

[[artifacts]]
id = "immutable-release-candidates"
kind = "release_evidence"
paths = ["out/release-candidate/**", "out/geometer-release-inventory-*.json"]
tracked = "forbidden"
produced_by = "the manual Build Release Candidate workflow from one reviewed source revision and one immutable OCCT lock"
included_in_release = "exact inventoried native archives, wheels, static SDKs, WASM, checksums, and provenance are promoted without rebuilding"
retention = "content-addressed R2 candidate objects survive workflow-artifact expiry; promoted tag aliases and their referenced candidates are retained permanently"

[[artifacts]]
id = "operation-transport-performance-baselines"
kind = "release_evidence"
paths = ["docs/research/evidence/operation-transport/**"]
tracked = "required"
produced_by = "controlled clean Windows x64 and macOS ARM64 baseline workflows followed by maintainer review"
included_in_release = "source and documentation distributions as the durable pre-implementation comparison authority"
retention = "committed raw JSON and inventory records permanently bind workflow run URLs, artifact digests, executable attestations, source revision, and reviewed budgets"

[[artifacts]]
id = "native-static-sdk-release-assets"
kind = "package_distribution"
paths = ["out/sdk-release/**"]
tracked = "forbidden"
produced_by = "byte-for-byte promotion of deterministic SDK candidates that already passed qualification; promotion never rebuilds or repackages them"
included_in_release = "four platform SDK archives with checksums, external sidecars, provenance, licenses, and corresponding-source material"
retention = "authoritative in the immutable R2 candidate/tag store and mirrored on the dated GitHub Release; local downloaded or staged copies remain generated state"

[[artifacts]]
id = "native-static-sdk-qualification-evidence"
kind = "release_evidence"
paths = ["out/sdk-evidence/qualification/**"]
tracked = "forbidden"
produced_by = "pre-promotion clean CMake and Cargo consumers plus the Windows/macOS KiCad Cruncher trial against exact SDK candidate bytes"
included_in_release = "compact external-consumer and KiCad trial reports are immutable dated GitHub Release assets whose digests are bound by the release inventory and block promotion"
retention = "owned by geometer-maintainers and retained with the immutable dated release for that release's support lifetime; local downloaded copies remain generated state"

[[artifacts]]
id = "native-static-sdk-post-release-verification"
kind = "release_evidence"
paths = ["out/sdk-evidence/post-release/**"]
tracked = "forbidden"
produced_by = "post-publication download, inventory, provenance, relocation, link, runtime, capability, and dependency verification"
included_in_release = "never added back to the immutable dated release; it gates issue closure and references the released inventory digest"
retention = "owned by geometer-maintainers and stored append-only under artifacts.wavenumber.net/geometer/release-verification/<tag>/ for the release support lifetime"
