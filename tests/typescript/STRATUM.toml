    "Replay governed contract vectors through generated strict TypeScript codecs.",
    "Fail closed when a native-only experimental operation omits the structural experimental marker.",
    "Encode, incrementally decode, and reject malformed executable IPC A0 frames without Node-specific package dependencies.",
    "Negotiate, execute, cancel, and shut down persistent IPC A0 clients over injected byte streams while rejecting structural-only operations.",
    "Spawn and supervise the native executable from Node, execute real STEP topology and model-bounds requests, and shut down cleanly.",
