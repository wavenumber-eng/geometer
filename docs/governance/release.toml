[[channels]]
id = "public-pypi"
kind = "pypi"
status = "active"
owner = "geometer-maintainers"
process_doc = "docs/developer/README.md"
build_doc = "docs/developer/README.md"

[[channels]]
id = "github-native-bundles"
kind = "native_bundle"
status = "active"
owner = "geometer-maintainers"
process_doc = "docs/developer/README.md"
build_doc = "docs/developer/README.md"

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "native-static-sdk-release-assets"
rationale = "After SDK support ships, the dated native release and complete SDK matrix form one atomic GitHub Release inventory; missing, extra, duplicate, repackaged, or digest-changed SDK assets block native promotion."

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "native-static-sdk-qualification-evidence"
rationale = "Native promotion is blocked unless durable consumer and downstream evidence binds the exact qualified SDK candidate bytes."

[[channels]]
id = "github-wasm-bundles"
kind = "wasm_bundle"
status = "active"
owner = "geometer-maintainers"
process_doc = "docs/developer/README.md"
build_doc = "docs/developer/README.md"

[[channels]]
id = "github-static-sdk"
kind = "github_release"
status = "active"
owner = "geometer-maintainers"
process_doc = "docs/geometer/requirements/geometer-req-011-supported_static_sdk_and_unified_runtime.md"
build_doc = "docs/developer/README.md"

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "native-static-sdk-candidates"
rationale = "Candidate SDK bytes remain noncommitted and must pass clean consumers and the KiCad Cruncher trial before promotion."

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "native-static-sdk-release-assets"
rationale = "The dated immutable GitHub Release is the human-facing compatibility mirror for the four static SDK profiles; every byte must match the R2 candidate inventory."

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "native-static-sdk-qualification-evidence"
rationale = "Candidate checksums, sidecars, provenance, clean-consumer results, and downstream trial evidence fail promotion closed."

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "native-static-sdk-post-release-verification"
rationale = "Append-only public-download verification gates issue closure without mutating the immutable dated release."

[[channels]]
id = "r2-immutable-release-store"
kind = "internal"
status = "active"
owner = "geometer-maintainers"
process_doc = "docs/developer/README.md"
build_doc = "docs/developer/ci-strategy.md"

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "immutable-release-candidates"
rationale = "R2 stores source- and inventory-addressed candidate bytes before promotion and an immutable tag alias only after PyPI and GitHub publication succeed."

[[channels.artifact_refs]]
kind = "governed_artifact"
target = "native-static-sdk-release-assets"
rationale = "Promoted SDK bytes remain byte-identical across R2 and GitHub Releases."
