[package]
name = "geometer-bundle"
version = "2026.11.22"
edition = "2024"
rust-version = "1.89"
description = "Bounded Geometer archive admission and digest-addressed executable materialization"
license = "MIT"
publish = false

[dependencies]
serde_json = "1.0"
sha2 = "0.11.0"
flate2 = "1.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
allow_attributes_without_reason = "deny"
