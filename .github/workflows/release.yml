---
# yamllint disable rule:line-length
name: Publish

"on":
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  verify:
    name: release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify generated contracts
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          npm ci
          npm run check:contracts
      - name: Verify tag matches package version
        shell: bash
        run: uv run python scripts/ci_release_metadata.py check-tag "${GITHUB_REF_NAME}"
      - name: Verify release notes mention package version
        shell: bash
        run: uv run python scripts/ci_release_metadata.py check-notes
      - name: Run release signoff gate
        run: uv run --group dev rack run L99_release
      - name: Run standards check
        run: uvx --from git+https://github.com/wavenumber-eng/wn-dev-std wn-dev-std check . --format json

  build:
    name: build (${{ matrix.platform }}, py3.12)
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            compiler: msvc
          - os: ubuntu-22.04
            platform: linux-x64
            compiler: gcc
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            compiler: gcc
          - os: macos-15
            platform: macos-arm64
            compiler: apple-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        if: matrix.platform == 'linux-x64'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restore pinned browser-test dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          npm install --global npm@11.16.0
          npm ci
          npm run check:node-toolchain

      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgl1-mesa-dev libdbus-1-dev libudev-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev wayland-protocols

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Cache OCCT
        uses: actions/cache@v5
        with:
          path: |
            .deps/occt-src
            .deps/native/${{ matrix.platform }}/occt-build
            .deps/native/${{ matrix.platform }}/occt-install
          key: occt-v2-native-${{ matrix.platform }}-${{ matrix.compiler }}-${{ steps.dependency_versions.outputs.occt_tag }}-${{ hashFiles('scripts/build_occt.py', 'scripts/dependency_versions.py', 'scripts/occt_binary_cache.py', 'third_party/rapidjson/**') }}
          restore-keys: |
            occt-v2-native-${{ matrix.platform }}-${{ matrix.compiler }}-${{ steps.dependency_versions.outputs.occt_tag }}-
            occt-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.compiler }}-${{ steps.dependency_versions.outputs.occt_tag }}-

      - name: Build and test production native code
        run: uv run --group dev python scripts/validate_native.py

      - name: Run production client strata against the Linux native build
        if: matrix.platform == 'linux-x64'
        env:
          GEOMETER_REQUIRE_NATIVE_TEST_SERVERS: "1"
          GEOMETER_TEST_PROFILE: production
        run: |
          uv tool install git+https://github.com/wavenumber-eng/wn-dev-std
          uv run --group dev rack run python
          uv run --group dev rack run rust
          uv run --group dev rack run typescript

      - name: Test Python package
        run: uv run --group dev python scripts/validate_python_package.py --skip-native-validation --wheelhouse out/wheelhouse

      - name: Check wheel metadata
        run: uv run --group dev twine check out/wheelhouse/*.whl

      - name: Package native dist
        run: uv run --no-project python scripts/package_release_artifacts.py native --platform ${{ matrix.platform }} --output out/native-${{ matrix.platform }}.zip

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ matrix.platform }}
          path: out/wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-dist-${{ matrix.platform }}
          path: out/native-${{ matrix.platform }}.zip
          if-no-files-found: error

  wasm:
    name: wasm dist
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Node toolchain
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          npm ci

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Cache Emscripten SDK
        uses: actions/cache@v5
        with:
          path: .deps/emsdk
          key: emsdk-v2-linux-x64-${{ steps.dependency_versions.outputs.emsdk_version }}
          restore-keys: |
            emsdk-Linux-X64-${{ steps.dependency_versions.outputs.emsdk_version }}

      - name: Cache WASM OCCT install
        uses: actions/cache@v5
        with:
          path: |
            .deps/occt-src
            .deps/occt-wasm-build
            .deps/occt-wasm-install
          key: occt-v2-wasm-linux-x64-emscripten-${{ steps.dependency_versions.outputs.occt_tag }}-${{ steps.dependency_versions.outputs.emsdk_version }}-${{ hashFiles('scripts/build_wasm.py', 'scripts/build_occt.py', 'scripts/dependency_versions.py', 'scripts/occt_binary_cache.py', 'third_party/rapidjson/**') }}
          restore-keys: |
            occt-v2-wasm-linux-x64-emscripten-${{ steps.dependency_versions.outputs.occt_tag }}-${{ steps.dependency_versions.outputs.emsdk_version }}-
            wasm-occt-install-Linux-X64-${{ steps.dependency_versions.outputs.occt_tag }}-${{ steps.dependency_versions.outputs.emsdk_version }}-

      - name: Cache Geometer WASM build
        uses: actions/cache@v5
        with:
          path: build-wasm
          key: geometer-wasm-v2-linux-x64-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', 'third_party/clipper2/**') }}
          restore-keys: |
            geometer-wasm-v2-linux-x64-
            geometer-wasm-build-Linux-X64-

      - name: Build WASM artifacts
        run: uv run python scripts/build_wasm.py

      - name: Build production browser demos
        run: |
          google-chrome --version
          npm run check:typescript
          uv run python scripts/build_hlr_site.py
          uv run python scripts/build_illustration_site.py
          uv run python scripts/build_standalone_demos.py hlr
          uv run python scripts/build_standalone_demos.py illustration
          node tests/typescript/hlr_static_site_validation.mjs
          node tests/typescript/illustration_static_site_validation.mjs
          uv run pytest tests/wasm/test_hlr_static_site.py tests/wasm/test_illustration_static_site.py -q
          uv run pytest tests/python/test_package_single_html_site.py -q

      - name: Run WASM validation tests
        run: |
          node tests/typescript/wasm_client_validation.mjs
          node tests/wasm/planar_batch_solve_bytes_validation.js
          node tests/wasm/step_to_glb_bytes_validation.js

      - name: Package WASM dist
        run: python -c "import pathlib, shutil; pathlib.Path('out').mkdir(exist_ok=True); shutil.make_archive('out/wasm-dist', 'zip', 'dist/wasm')"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-dist
          path: out/wasm-dist.zip
          if-no-files-found: error

  github-assets:
    name: GitHub release assets
    needs: [build, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: out/release

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          find out/release -type f -print0 | xargs -0 gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    name: PyPI trusted publish
    needs: [build, wasm]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/wn-geometer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-dist-*
          path: dist-pypi
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi
