name = "Release Signoff"
order = 99
description = "Final release gate: Ruff, Pyright, uv lock, clang-format, Lizard, code hygiene, and stale artifact checks. Required before tagging."
enabled = true
runner = "pytest"
concerns = ["release", "signoff", "lint", "format", "hygiene"]

objectives = [
    "Require Python lint to pass through Ruff.",
    "Require Python static analysis to pass through Pyright.",
    "Require uv.lock to remain current.",
    "Require touched C++ style to remain clang-format compatible.",
    "Require source complexity to remain under the Lizard release threshold.",
    "Prevent stale root dist artifacts and completed working plans from returning.",
    "Keep file length and Python complexity within the release hygiene floor.",
]

[[subtests]]
id = "L99_001"
file = "test_release_signoff.py"
name = "Release Signoff"
description = "Runs Ruff, Pyright, uv lock --check, clang-format dry-run, Lizard, and scripts/check_code_hygiene.py."
test_case_type = "release-gate"
