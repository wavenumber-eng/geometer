---
# yamllint disable rule:line-length
name: Full Validation (Manual)

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: wn-dev-std
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Verify generated contracts
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          npm ci
          npm run check:contracts
      - name: Run release signoff gate
        run: uv run --group dev rack run L99_release
      - name: Run standards check
        run: uvx --from wn-dev-std==2026.9.8 wn-dev-std check . --format json

  native:
    name: native (linux-x64, py3.12)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Restore pinned client dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
          npm run check:node-toolchain
      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgl1-mesa-dev libdbus-1-dev libudev-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev wayland-protocols
      - name: Build and test production native code
        run: uv run --group dev python scripts/validate_native.py
      - name: Run production client strata against the native build
        env:
          GEOMETER_REQUIRE_NATIVE_TEST_SERVERS: "1"
          GEOMETER_TEST_PROFILE: production
          GEOMETER_TYPESCRIPT_SCOPE: host
        run: |
          uv tool install wn-dev-std==2026.9.8
          uv run --group dev rack run python
          uv run --group dev rack run rust
          uv run --group dev rack run typescript
      - name: Test Python package
        run: uv run --group dev python scripts/validate_python_package.py --skip-native-validation --wheelhouse out/wheelhouse
      - name: Check wheel
        run: uv run --group dev twine check out/wheelhouse/*.whl
      - name: Upload Linux validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-linux-x64
          path: |
            out/wheelhouse/*.whl
            dist/native/linux-x64/*
          if-no-files-found: error

  wasm:
    name: Production WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Read dependency versions
        id: dependency_versions
        run: uv run --no-project python scripts/dependency_versions.py --github-output
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Node toolchain
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"
          npm ci
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Cache Emscripten SDK
        uses: actions/cache@v5
        with:
          path: .deps/emsdk
          key: emsdk-v2-linux-x64-${{ steps.dependency_versions.outputs.emsdk_version }}
          restore-keys: |
            emsdk-Linux-X64-${{ steps.dependency_versions.outputs.emsdk_version }}
      - name: Cache Geometer WASM build
        uses: actions/cache@v5
        with:
          path: build-wasm
          key: geometer-wasm-v2-linux-x64-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', 'third_party/clipper2/**') }}
          restore-keys: |
            geometer-wasm-v2-linux-x64-
            geometer-wasm-build-Linux-X64-
      - name: Build WASM artifacts
        run: uv run python scripts/build_wasm.py
      - name: Build production browser demos
        run: |
          google-chrome --version
          uv run python scripts/build_hlr_site.py
          uv run python scripts/build_illustration_site.py
          uv run python scripts/build_standalone_demos.py hlr
          uv run python scripts/build_standalone_demos.py illustration
          uv run pytest tests/wasm/test_hlr_static_site.py tests/wasm/test_illustration_static_site.py -q
      - name: Validate TypeScript package against candidate WASM
        env:
          GEOMETER_TEST_PROFILE: production
          GEOMETER_TYPESCRIPT_SCOPE: wasm
        run: uv run --group dev rack run typescript
      - name: Run production WASM validation
        run: |
          node tests/wasm/planar_batch_solve_bytes_validation.js
          node tests/wasm/step_to_glb_bytes_validation.js
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-wasm-dist
          path: dist/wasm/**
          if-no-files-found: error
